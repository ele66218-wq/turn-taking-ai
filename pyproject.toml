[project]
name = "turn-taking-ai"
version = "0.1.0"
description = "User interruption-intent estimation for real-time spoken dialogue (when should the AI stop talking?)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

# Core runtime dependencies.
# numpy (BSD-3), scipy (BSD-3), scikit-learn (BSD-3), joblib (BSD-3),
# soundfile (BSD-3), PyYAML (MIT) -- all permissive licenses.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "soundfile>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# sounddevice (MIT) is only needed for microphone capture, not for training.
mic = ["sounddevice>=0.4"]
# Stage-2 experiments: wav2vec2 / HuBERT embeddings.
# torch (BSD-3), transformers (Apache-2.0)
embeddings = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
turn-taking = "turn_taking.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
